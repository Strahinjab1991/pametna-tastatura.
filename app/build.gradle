plugins {
    id 'com.android.application'
}

android {
    namespace 'ba.cncmikron.tastatura'
    compileSdk 35

    defaultConfig {
        applicationId 'ba.cncmikron.tastatura'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // rjecnik se ne smije kompresovati nepotrebno
    androidResources {
        noCompress 'txt'
    }
}
