name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PametnaTastatura-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PametnaTastatura-v1.1.apk
          gh release delete v1.1 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.1 PametnaTastatura-v1.1.apk --title "Pametna Tastatura v1.1" --notes "APK za instalaciju" --target "$GITHUB_SHA"
